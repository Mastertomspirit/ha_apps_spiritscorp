name: "Build & Publish Home Assistant App"

on:
  release:
    types: ["published"]
  workflow_dispatch:
    inputs:
      target:
        description: "App target folder to build (Default: mimir)"
        required: true
        default: "mimir"
      version:
        description: "Git Tag or Branch or all (Default: main)"
        required: true
        default: "main"

env:
  ARCHITECTURES: '["amd64", "aarch64"]'

jobs:
  resolve-targets:
    name: "Resolve Build Targets"
    runs-on: ubuntu-26
    outputs:
      targets: ${{ steps.set-targets.outputs.targets }}
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.version }}

      - name: "Set targets array"
        id: set-targets
        run: |
          if [ "${{ inputs.target }}" = "all" ]; then
            TARGETS_JSON=$(find . -maxdepth 2 -name "Dockerfile" -exec dirname {} \; | sed 's|^\./||' | jq -R . | jq -s -c .)
            echo "targets=${TARGETS_JSON}" >> $GITHUB_OUTPUT
          else
            echo "targets=[\"${{ inputs.target }}\"]" >> $GITHUB_OUTPUT
          fi

  init:
    name: "Initialize Build Matrix for ${{ matrix.target }}"
    needs: resolve-targets
    runs-on: ubuntu-26
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Build matrix from architectures
        id: matrix
        shell: bash
        env:
          ARCHITECTURES: ${{ env.ARCHITECTURES }}
          REGISTRY_PREFIX: "ghcr.io/${{ github.repository_owner }}"
          TARGETS: ${{ needs.resolve-targets.outputs.targets }}
        run: |
          matrix='{"include":[]}'
          for target in $(jq -r '.[]' <<< "${TARGETS}"); do
            IMAGE_NAME="ha-spiritscorp-${target}"
            for arch in $(jq -r '.[]' <<< "${ARCHITECTURES}"); do
              case "${arch}" in
                amd64)   os="ubuntu-24.04" ;;
                aarch64) os="ubuntu-24.04-arm" ;;
                *)
                  echo "::error::Unsupported architecture: ${arch}. Supported values: amd64, aarch64"
                  exit 1
                  ;;
              esac
              matrix=$(jq -c \
                --arg target "$target" \
                --arg arch "$arch" \
                --arg os "$os" \
                --arg image "${REGISTRY_PREFIX}/${arch}-${IMAGE_NAME}" \
                '.include += [{target: $target, arch: $arch, os: $os, image: $image}]' <<< "${matrix}")
            done
          done
          echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"
          jq . <<< "${matrix}"

  build:
    name: "Build ${{ matrix.arch }} (${{ matrix.target }})"
    needs: [resolve-targets, init]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read # To check out the code
      id-token: write # Write needed for Cosign signing (issue OIDC token for signing)
      packages: write # To push built images to GitHub Container Registry
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.init.outputs.matrix) }}
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.version }}

      - name: "Build image"
        uses: home-assistant/builder/actions/build-image@2026.09.0
        with:
          arch: ${{ matrix.arch }}
          context: ${{ matrix.target }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          image: ${{ matrix.image }}
          image-tags: |
            ${{ github.event.release.tag_name || inputs.version }}
            'latest'
          push: "true"
          version: ${{ github.event.release.tag_name || inputs.version }}

  manifest:
    name: "Publish Multi-Arch Manifest (${{ matrix.target }})"
    needs: [resolve-targets, init, build]
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Write needed for Cosign signing (issue OIDC token for signing)
      packages: write # To push the manifest to GitHub Container Registry
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.init.outputs.targets) }}
    steps:
      - name: "Publish multi-arch manifest"
        uses: home-assistant/builder/actions/publish-multi-arch-manifest@2026.09.0
        with:
          architectures: ${{ env.ARCHITECTURES }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          image-name: "ha-spiritscorp-${{ matrix.target }}"
          image-tags: |
            ${{ github.event.release.tag_name || inputs.version }}