name: "Build & Publish Home Assistant App"

on:
  release:
    types: ["published"]
  workflow_dispatch:
    inputs:
      target:
        description: "App target folder to build (Default: mimir)"
        required: false
        default: "mimir"
      version:
        description: "Git Tag or Branch (Default: main)"
        required: false
        default: "main"

jobs:
  build:
    name: "Build Multi-Arch App (home-assistant/builder)"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@v7
        with:
           ref: ${{ inputs.version || github.ref }}       
        
      - name: "Login to GitHub Container Registry"
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: "Build App Container"
        uses: home-assistant/builder@master
        with:
          args: |
            --amd64 \
            --aarch64 \
            --target ${{ inputs.target || 'mimir' }} \
            --image "${{ inputs.target || 'mimir' }}-{arch}" \
            --docker-hub "ghcr.io/${{ github.repository_owner }}"
