name: "Build & Publish Home Assistant App"

on:
  release:
    types: ["published"]
  workflow_dispatch:
    inputs:
      target:
        description: "App target folder to build (Default: mimir)"
        required: false
        default: "mimir"
      version:
        description: "Git Tag or Branch (Default: main)"
        required: false
        default: "main"

jobs:
  build:
    name: "Build Multi-Arch App Images"
    permissions:
      contents: read
      packages: write
    uses: home-assistant/actions/.github/workflows/builder.yaml@v1
    with:
      args: |
        --amd64 \
        --aarch64 \
        --target ${{ inputs.target || 'mimir' }} \
        --version ${{ inputs.version || github.ref_name }} \        
        --image "ha-spiritscorp-${{ inputs.target || 'mimir' }}-{arch}" \
        --docker-hub "ghcr.io/${{ github.repository_owner }}"
    secrets:
      registry_password: ${{ secrets.GITHUB_TOKEN }}